// vortex-balance.cfg — g_balance_* divergence — gameplay values outside the weapon tables.
//
// Empty by design: Vortex currently diverges from stock here in nothing. The file exists rather
// than being absent so that ConfigInterpreter.FilesMissing stays at ZERO on a normal boot — a
// counter that is permanently non-zero is useless as a signal, and that counter is how a genuinely
// missing config gets noticed (ConfigTests pins the missing-file-is-a-no-op behaviour).
//
// Add divergence with plain `set`, not `seta`. Per ConfigLoader's archive-hook contract the
// SHIPPED cfgs are the authority on which cvars are archiveable; `seta` here would widen the
// player's config.cfg beyond upstream's set. Use it only to introduce a deliberately new
// archiveable cvar.
