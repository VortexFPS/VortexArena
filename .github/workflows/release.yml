name: Release

# Build the full release matrix and publish downloadable "fat" zips (binary + Godot runtime + all Xonotic
# data) to GitHub Releases. See planning/decisions/ADR-0014-ci-packaging-distribution.md and docs/RELEASING.md.
#
# Trigger:
#   - push a tag `vX.Y.Z`  â†’ builds all targets and PUBLISHES a GitHub Release with the zips attached.
#   - workflow_dispatch    â†’ builds all targets and uploads them as Actions artifacts only (no Release).
#                            Use this to shake out the export path without cutting a real release.
#
# Topology â€” one job per native runner (each platform exports on its OWN OS; we do NOT cross-export, which
# ADR-0014 flags as the flakiest path). Core content is committed and arrives with checkout; only compiled
# maps are fetched, per data/maps.lock.json, cached on the lockfile hash.
#
#   windows â†’ export windows-client                     â†’ fat zip
#   linux   â†’ export linux-client + linux-dedicated     â†’ 2 fat zips
#   macos   â†’ export macos-client (continue-on-error)   â†’ fat zip   [BEST-EFFORT: see ADR-0014 Â§macOS]
#   release â†’ collect all zips, checksum, publish to GitHub Releases (tag pushes only)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version string for the zip names (dispatch runs don't publish a Release)"
        default: "dev"
        type: string

# Least privilege: read-only for every job, write granted only to the one job that publishes (below).
# Previously this granted contents:write workflow-wide, so all six jobs held a token that could push to
# the repository — including the ones that only build. GitHub's own
# security-hardening guidance is to keep the default read-only and grant per job, which is also why the
# org's read-only default GITHUB_TOKEN setting is correct and should stay.
permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  GODOT_VERSION: "4.6.3"
  # Run the Node-20 JS actions (checkout/cache/upload-artifact/â€¦) on Node 24 now â€” the documented opt-in
  # ahead of GitHub's forced switch. No-op once Node 24 is the default.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # â”€â”€ Resolve the version string once, share it with every job â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  prep:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi
  # Core content, music and fonts arrive with `actions/checkout` (committed to this repo since the
  # restructure), so the old `assets` job - download-assets.sh into a tar artifact fanned out to the
  # build jobs - is gone entirely (item 20). Compiled maps come from tools/data/fetch-maps.py, keyed on
  # data/maps.lock.json rather than on a script's hash: the key now invalidates when the MAP SET changes
  # instead of when the fetching code changes, which is the correct trigger.


  # â”€â”€ Windows desktop client â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  windows:
    needs: [prep]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false   # the map SOURCE tree (1.5 GB) is irrelevant to building a client
      - uses: actions/setup-dotnet@v5
        with: { dotnet-version: "9.0.x" }       # global.json: 8.0.0 + rollForward latestMajor

      # The nuget.config "godot-editor" source is a dev-machine-local Windows path that doesn't exist on a
      # clean runner; NuGet (and the Godot.NET.Sdk MSBuild resolver) hard-fail on a missing local source.
      - name: Drop the dev-machine Godot editor NuGet source
        run: dotnet nuget remove source godot-editor --configfile nuget.config
        shell: bash

      - uses: chickensoft-games/setup-godot@v2
        with: { version: "${{ env.GODOT_VERSION }}", use-dotnet: true, include-templates: true }

      - name: Import resources (first project open + .NET glue)
        run: godot --headless --path . --import || true
        shell: bash

      # The Windows export needs the PATCHED template (ADR-0017). Until this step existed,
      # custom_template/release was an absolute path to one dev box, so CI could not produce a correct
      # Windows build at all — it failed the export outright, which was at least loud. Verified against
      # the sha256 in engine.lock.json; a mismatch deletes the download rather than leaving a
      # half-verified engine binary where the next run would find it.
      - name: Fetch the pinned engine template
        run: python tools/data/fetch-engine-template.py --only windows
        shell: bash

      # Pre-export gate: assert custom_template/release is populated, names the file the lockfile pins,
      # that file's sha256 matches, and it is in a form the Windows exporter can open. Cheap, and it
      # fails in seconds rather than after a full export. It is not a substitute for the content check
      # below (it cannot see what Godot actually did), but it catches G10's actual cause - the field
      # being blanked - before any time is spent.
      #
      # --audit-presets rides along because it is the only check that sees a preset NOBODY listed: every
      # --preset-config below is invoked by name, so a preset added to export_presets.cfg later would be
      # gated by no step in any job and every one of them would stay green. It reads committed text
      # only, so this Windows job is as good a place for it as any and it needs no template on disk.
      - name: Verify the engine template is configured and pinned
        run: python tools/verify-engine-template.py --audit-presets --preset-config windows-client
        shell: bash

      - name: Export windows-client
        # Godot's headless export often exits non-zero on benign warnings â€” `|| true`, then assert the
        # binary actually appeared so a REAL export failure (no output) still fails the job.
        run: |
          mkdir -p dist/windows-client
          godot --headless --path . --export-release "windows-client" dist/windows-client/VortexArena.exe || true
          test -f dist/windows-client/VortexArena.exe
        shell: bash

      # G10. `test -f` above proves a file appeared, which is NOT the same as proving the right engine
      # went into it: measured 2026-07-29, an empty custom_template/release makes Godot export a
      # complete, launchable binary from the STOCK template, so `|| true` plus a file check goes green on
      # a build missing every backport in tools/engine-patches/. This asserts on the binary's CONTENT,
      # which is the only thing that speaks to what shipped.
      - name: Verify the engine template that was used
        run: |
          python tools/verify-engine-template.py --patches \
            --binary dist/windows-client/VortexArena.exe --preset windows-client
        shell: bash

      # Maps are build output, fetched per data/maps.lock.json. Cached on the LOCKFILE hash so the cache
      # invalidates when the pinned map set changes rather than when the fetch script is edited.
      - name: Cache compiled maps
        uses: actions/cache@v6
        with:
          path: data/maps
          key: vortex-maps-${{ hashFiles('data/maps.lock.json') }}

      - name: Fetch compiled maps
        run: python tools/data/fetch-maps.py
        shell: bash

      - name: Package
        run: bash tools/package.sh --version "${{ needs.prep.outputs.version }}" windows-client
        shell: bash

      - uses: actions/upload-artifact@v7
        with: { name: zip-windows, path: "dist/VortexArena-*-windows-x86_64.zip", if-no-files-found: error }

  # â”€â”€ Linux desktop client + headless dedicated server â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  linux:
    needs: [prep]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false   # the map SOURCE tree (1.5 GB) is irrelevant to building a client
      - uses: actions/setup-dotnet@v5
        with: { dotnet-version: "9.0.x" }
      - name: Drop the dev-machine Godot editor NuGet source
        run: dotnet nuget remove source godot-editor --configfile nuget.config

      - uses: chickensoft-games/setup-godot@v2
        with: { version: "${{ env.GODOT_VERSION }}", use-dotnet: true, include-templates: true }

      - name: Import resources
        run: godot --headless --path . --import || true

      # Both Linux presets consume the SAME pinned template (one file, two presets). It carries none of
      # tools/engine-patches/ - the patch set touches platform/windows/ exclusively - so this is a
      # PROVENANCE pin, not a functional one: it makes "which engine is this server running" answerable
      # instead of "whatever stock template the runner had installed". Verified against the sha256 in
      # engine.lock.json; a mismatch deletes the download rather than leaving a half-verified binary.
      - name: Fetch the pinned engine template
        run: python tools/data/fetch-engine-template.py --only linux

      # This is the ONLY G10 gate the Linux presets can have, and it runs before the export rather than
      # after: no binary marker can tell a patched Linux template from a stock one, because there is no
      # difference to find. So an emptied custom_template/release must be caught here, on the INPUT.
      # It also asserts the template is a real ELF and not, say, an archive - the mistake that made
      # macos-client unpinnable, which a sha256 passes straight over.
      - name: Verify the engine templates are configured and pinned
        run: |
          python tools/verify-engine-template.py \
            --preset-config linux-client --preset-config linux-dedicated

      - name: Export linux-client + linux-dedicated
        # Godot's headless export often exits non-zero on benign warnings â€” `|| true`, then assert outputs.
        run: |
          mkdir -p dist/linux-client dist/linux-dedicated
          godot --headless --path . --export-release "linux-client"    dist/linux-client/VortexArena.x86_64 || true
          godot --headless --path . --export-release "linux-dedicated" dist/linux-dedicated/vortexarena-dedicated.x86_64 || true
          test -f dist/linux-client/VortexArena.x86_64
          test -f dist/linux-dedicated/vortexarena-dedicated.x86_64

      # Deliberately NOT called "verify the engine template that was used" like the Windows step: on
      # Linux this asserts only the contamination canary (no dev material in the pck), and the script
      # prints NOT CONTENT-VERIFIED plus a qualified summary rather than a clean bill. Naming it after a
      # check that cannot run here is how a green tick starts meaning less than a reader assumes.
      # The canary itself is real and platform-independent, and it was previously checked on Windows
      # alone even though exclude_filter is per-preset and can regress on any of them.
      - name: Check the exported binaries for dev-material contamination
        run: |
          python tools/verify-engine-template.py \
            --binary dist/linux-client/VortexArena.x86_64 --preset linux-client
          python tools/verify-engine-template.py \
            --binary dist/linux-dedicated/vortexarena-dedicated.x86_64 --preset linux-dedicated


      # Maps are build output, fetched per data/maps.lock.json. Cached on the LOCKFILE hash so the cache
      # invalidates when the pinned map set changes rather than when the fetch script is edited.
      - name: Cache compiled maps
        uses: actions/cache@v6
        with:
          path: data/maps
          key: vortex-maps-${{ hashFiles('data/maps.lock.json') }}

      - name: Fetch compiled maps
        run: python tools/data/fetch-maps.py
        shell: bash

      - name: Package
        run: bash tools/package.sh --version "${{ needs.prep.outputs.version }}" linux-client linux-dedicated

      - uses: actions/upload-artifact@v7
        with: { name: zip-linux, path: "dist/VortexArena-*-linux*.zip", if-no-files-found: error }

  # â”€â”€ macOS desktop client (BEST-EFFORT â€” never blocks the Win/Linux release) â”€â”€
  macos:
    needs: [prep]
    runs-on: macos-latest
    continue-on-error: true       # macOS export config (codesign/bundle id) is unverified â€” see ADR-0014
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false   # the map SOURCE tree (1.5 GB) is irrelevant to building a client
      - uses: actions/setup-dotnet@v5
        with: { dotnet-version: "9.0.x" }
      - name: Drop the dev-machine Godot editor NuGet source
        run: dotnet nuget remove source godot-editor --configfile nuget.config

      - uses: chickensoft-games/setup-godot@v2
        with: { version: "${{ env.GODOT_VERSION }}", use-dotnet: true, include-templates: true }

      - name: Import resources
        run: godot --headless --path . --import || true

      # NO template fetch here, deliberately. macos-client exports from the STOCK template that
      # setup-godot installs, because the macOS template we publish cannot be used as a custom template:
      # Godot's macOS exporter unzips custom_template/release and reads macos_template.app/ out of it,
      # while our published asset is the raw lipo output, a Mach-O fat binary. Pointing the preset at it
      # does not fall back to stock - it aborts the export, and on this continue-on-error job that would
      # drop the macOS build from the release without turning anything red.
      #
      # This step therefore REPORTS the gap rather than closing it: engine.lock.json declares
      # macos-client under unpinned_presets with the reason and what unblocks it, and the script prints
      # that as KNOWN GAP. Downloading the 149 MB template here would cost four minutes to verify a file
      # nothing consumes.
      - name: Report the macOS engine-template gap
        run: python tools/verify-engine-template.py --preset-config macos-client

      - name: Export macos-client
        # Godot's headless export often exits non-zero on benign warnings â€” `|| true`, then assert the .app.
        run: |
          mkdir -p dist/macos-client
          godot --headless --path . --export-release "macos-client" dist/macos-client/VortexArena.app || true
          test -d dist/macos-client/VortexArena.app

      # Canary only, like Linux, and named accordingly - see the Linux job for why this is not called a
      # template verification. The script resolves the .app bundle to Contents/MacOS/<exe> itself, so the
      # export path can be passed verbatim instead of hard-coding a bundle layout in two places.
      - name: Check the exported binary for dev-material contamination
        run: |
          python tools/verify-engine-template.py \
            --binary dist/macos-client/VortexArena.app --preset macos-client


      # Maps are build output, fetched per data/maps.lock.json. Cached on the LOCKFILE hash so the cache
      # invalidates when the pinned map set changes rather than when the fetch script is edited.
      - name: Cache compiled maps
        uses: actions/cache@v6
        with:
          path: data/maps
          key: vortex-maps-${{ hashFiles('data/maps.lock.json') }}

      - name: Fetch compiled maps
        run: python tools/data/fetch-maps.py
        shell: bash

      - name: Package
        run: bash tools/package.sh --version "${{ needs.prep.outputs.version }}" macos-client

      - uses: actions/upload-artifact@v7
        with: { name: zip-macos, path: "dist/VortexArena-*-macos-*.zip", if-no-files-found: warn }

  # â”€â”€ Collect every zip, checksum, and publish the GitHub Release â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  release:
    needs: [prep, windows, linux, macos]
    runs-on: ubuntu-latest
    # softprops/action-gh-release creates the Release and uploads assets, which GitHub counts as a
    # `contents` write — there is no separate `releases` scope, so this is the narrowest grant that can
    # publish. Confined to this job precisely because it is coarse: the same token could also push
    # commits or move tags.
    permissions:
      contents: write
    steps:
      - name: Collect all zip artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: zip-*
          path: out
          merge-multiple: true

      - name: Flatten + checksum
        run: |
          mkdir -p final
          # Flatten whatever nesting upload-artifact produced into one dir, then checksum.
          find out -name 'VortexArena-*.zip' -exec mv {} final/ \;
          cd final
          sha256sum VortexArena-*.zip > "SHA256SUMS-${{ needs.prep.outputs.version }}.txt"
          echo "â”€â”€ release contents â”€â”€"; ls -lh

      # Tag pushes publish a real Release; workflow_dispatch runs stop here (artifacts only).
      # prerelease is derived from the TAG rather than hand-set, so an -alpha/-beta/-rc can never
      # accidentally become `releases/latest`. That matters because the launcher's primary feed is
      # /releases/latest/download/latest.json: a release that becomes `latest` without a manifest 404s
      # that path and drops every client onto the unauthenticated API at 60 req/hr. No release carries
      # latest.json until the manifest wiring lands (planning/TODO.md TODO-CORE-ZIP), so `latest` is
      # better left unset than pointing at something incomplete.
      - name: Classify the tag
        if: startsWith(github.ref, 'refs/tags/')
        id: rel
        shell: bash
        run: |
          case "${{ github.ref_name }}" in
            *-alpha*|*-beta*|*-rc*) echo "prerelease=true"  >> "$GITHUB_OUTPUT" ;;
            *)                      echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "tag ${{ github.ref_name }} -> prerelease=$(grep -o 'true\|false' "$GITHUB_OUTPUT" | tail -1)"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: VortexArena ${{ github.ref_name }}
          prerelease: ${{ steps.rel.outputs.prerelease }}
          generate_release_notes: true
          body: |
            > **Existing installs must reinstall once.** Every shipped artifact was renamed
            > `XonoticGodot-*` → `VortexArena-*`, and the launcher installs by asset name, so an install
            > pinned to an older release will not follow the rename. A deliberate one-way cutover, not a
            > routine update — see `docs/RELEASING.md`.

            Fat archives: binary + Godot runtime + all game content. Unzip and run, and keep the files
            together — the game loads `data/` from beside the binary.

            The Windows and Linux builds are exported from a Godot template pinned by
            `tools/engine-patches/engine.lock.json`, so the engine they ship is a recorded fact rather
            than whatever the build machine had installed
            (`planning/decisions/ADR-0017-engine-patches.md`).

            The **Windows** template additionally carries the high-polling-rate mouse-input backport,
            and the release job asserts the shipped Windows binary actually contains it rather than
            trusting the export to have used it. The Linux template carries no patches: the patch set
            touches Windows code only, so it is equivalent in behaviour to the official build and is
            pinned for provenance.

            The **macOS** build uses the stock Godot 4.6.3 template. It is equivalent in behaviour for
            the same reason, but which template it used is not recorded; see `unpinned_presets` in the
            lockfile for why and what would close it.

            ---
          fail_on_unmatched_files: true
          files: |
            final/VortexArena-*.zip
            final/SHA256SUMS-*.txt
