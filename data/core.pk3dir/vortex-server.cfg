// vortex-server.cfg — server-side rules, gametype and mutator divergence.
//
// The file exists rather than being absent so that ConfigInterpreter.FilesMissing stays at ZERO on
// a normal boot — a counter that is permanently non-zero is useless as a signal, and that counter
// is how a genuinely missing config gets noticed (ConfigTests pins the missing-file-is-a-no-op
// behaviour).
//
// Add divergence with plain `set`, not `seta`. Per ConfigLoader's archive-hook contract the
// SHIPPED cfgs are the authority on which cvars are archiveable; `seta` here would widen the
// player's config.cfg beyond upstream's set. Use it only to introduce a deliberately new
// archiveable cvar.

// The default server name. Overrides xonotic-server.cfg:12's "Xonotic $g_xonoticversion Server":
// this game advertises itself as Vortex (VortexArena.Net.GameIdentity), so a host that has not been
// given a name should say so rather than claiming to be an Xonotic server. That upstream default also
// came out as "Xonotic  Server", with a double space, because g_xonoticversion is set only in
// xonotic-common.cfg — which this port's boot chain does not exec — so the interpolation had nothing
// to expand. `menu_use_default_hostname` still governs whether the menu replaces this with the
// player's own.
//
// The build goes in the name, as upstream's default does, so a server announces which version it is
// running without anyone having to open Server Info. $g_vortexversion is registered in code
// (VortexArena.Server.Cvars.RegisterDefaults) and BOTH config paths run that first — MenuState.Boot
// before ConfigLoader.Load, GameWorld before LoadServerConfig — so the interpolation resolves here on
// the listen server and the dedicated server alike.
hostname "Vortex $g_vortexversion Server"


// ── nades: throw them where the crosshair points ────────────────────────────────────────────────
// Xonotic biases a thrown nade sideways TWICE, in opposite directions, and neither is documented as
// intentional in any upstream commit:
//
//   1. mutators.cfg:198  g_nades_throw_offset "0 -25 0"  — the y goes on v_right, and v_right really
//      does point right (AngleVectors gives (0,-1,0) at zero angles), so the nade materialises 25qu
//      to your LEFT. Mario added a hardcoded v_right*-10 in Jun 2013, raised it to -25 ten days later
//      (56cc3610e "Move thrown nades to the side a bit more"), then in Mar 2015 added this cvar at
//      "0 -20 0" WITHOUT removing the hardcode — Xonotic shipped a 45qu offset for two and a half
//      years until Martin Taibr folded them together in Aug 2017 (2416db2a5 "cleanup nade offset"),
//      landing on -25 with a TODO calling the value a floor-edge-bounce compromise for OK promode.
//   2. sv_nades.qc:629/678  the throw velocity carries a v_right term — 0.05 against 0.75 forward on
//      the weapon_drop path (3.81 deg RIGHT of the crosshair), 0.1 against 0.7 on the offhand path
//      (8.13 deg). Mario again, Jun 2013 (66318bb5b), carried verbatim ever since.
//
// Net effect upstream: the nade starts left of your aim and drifts right, crossing the aim line once
// (~375qu out on weapon_drop, ~175qu on offhand) and diverging past it. There is no range at which it
// goes where you are looking. Vortex zeroes both.
//
// The direction weights are a Vortex addition — Base hardcodes them, we read cvars (NadeThrow.cs).
// All three vectors are "forward right up" in the thrower's view basis. The weight vector's LENGTH
// scales the throw force, so zeroing the right term shortens the throw by 0.2% (weapon_drop) and 0.9%
// (offhand); minforce/maxforce are untouched.
//
// To play it Xonotic's way, put these three in server.cfg:
//   set g_nades_throw_offset "0 -25 0"
//   set g_nades_throw_dir "0.75 0.05 0.2"
//   set g_nades_throw_dir_offhand "0.7 0.1 0.2"
set g_nades_throw_offset "0 0 0" "nade spawn offset from the eye, \"forward right up\""
set g_nades_throw_dir "0.75 0 0.2" "nade throw direction for the 'weapon_drop' bind, \"forward right up\"; length scales the throw force"
set g_nades_throw_dir_offhand "0.7 0 0.2" "nade throw direction for the '+hook' bind, \"forward right up\"; length scales the throw force"
