// ---- Vortex lighting (see planning/lighting-realtime-and-lightgrid-2026-08-05.md) ----------------
// Everything below is WIRED - each cvar has a reader that changes what the renderer does. The two that
// actually cost frame time (dynamic-light shadows, and world geometry casting into them) escalate the way
// Xonotic's own presets escalate r_shadow_realtime_dlight_shadows: off until ultra.
r_model_lightgrid 1              // per-pixel model lighting from the map's baked light grid (DP default 1)
r_model_dlight 1                  // dynamic lights also reach grid-lit models
r_shadow_dlight_max 16                // cap on simultaneously visible dynamic lights (0 = unlimited)
r_shadow_dlight_shadow_budget 0     // how many of them may cast a shadow
r_shadow_world_casts 0              // world geometry casts into those shadows (the other half of the cost)
r_fakeshadows 2                     // cheap projected ground blobs under players and pickups (0/1/2)
cl_rimlight 0                       // gameplay rim light - OFF in every preset; it is a balance choice
r_warpzone 1                        // warpzone portal views - ON everywhere: you navigate THROUGH these,
                                    // so they are not an ornament to drop at low quality. (Reflections,
                                    // r_water, are a different feature and are not implemented yet.)
// Volumetric fog and SDFGI are deliberately absent from every preset: both are opt-in only, and fog that
// hides players is a gameplay change rather than a graphics one. Set r_volumetricfog / r_gi by hand.
