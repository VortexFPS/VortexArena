name: Release

# Build the full release matrix and publish downloadable "fat" zips (binary + Godot runtime + all Xonotic
# data) to GitHub Releases. See planning/decisions/ADR-0014-ci-packaging-distribution.md and docs/RELEASING.md.
#
# Trigger:
#   - push a tag `vX.Y.Z`  â†’ builds all targets and PUBLISHES a GitHub Release with the zips attached.
#   - workflow_dispatch    â†’ builds all targets and uploads them as Actions artifacts only (no Release).
#                            Use this to shake out the export path without cutting a real release.
#
# Topology â€” one job per native runner (each platform exports on its OWN OS; we do NOT cross-export, which
# ADR-0014 flags as the flakiest path). Core content is committed and arrives with checkout; only compiled
# maps are fetched, per data/maps.lock.json, cached on the lockfile hash.
#
#   windows â†’ export windows-client                     â†’ fat zip
#   linux   â†’ export linux-client + linux-dedicated     â†’ 2 fat zips
#   macos   â†’ export macos-client (continue-on-error)   â†’ fat zip   [BEST-EFFORT: see ADR-0014 Â§macOS]
#   release â†’ collect all zips, checksum, publish to GitHub Releases (tag pushes only)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version string for the zip names (dispatch runs don't publish a Release)"
        default: "dev"
        type: string

# Least privilege: read-only for every job, write granted only to the one job that publishes (below).
# Previously this granted contents:write workflow-wide, so all six jobs held a token that could push to
# the repository — including the ones that only build. GitHub's own
# security-hardening guidance is to keep the default read-only and grant per job, which is also why the
# org's read-only default GITHUB_TOKEN setting is correct and should stay.
permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  GODOT_VERSION: "4.6.3"
  # Run the Node-20 JS actions (checkout/cache/upload-artifact/â€¦) on Node 24 now â€” the documented opt-in
  # ahead of GitHub's forced switch. No-op once Node 24 is the default.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # â”€â”€ Resolve the version string once, share it with every job â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  prep:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi
  # Core content, music and fonts arrive with `actions/checkout` (committed to this repo since the
  # restructure), so the old `assets` job - download-assets.sh into a tar artifact fanned out to the
  # build jobs - is gone entirely (item 20). Compiled maps come from tools/data/fetch-maps.py, keyed on
  # data/maps.lock.json rather than on a script's hash: the key now invalidates when the MAP SET changes
  # instead of when the fetching code changes, which is the correct trigger.


  # â”€â”€ Windows desktop client â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  windows:
    needs: [prep]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false   # the map SOURCE tree (1.5 GB) is irrelevant to building a client
      - uses: actions/setup-dotnet@v5
        with: { dotnet-version: "9.0.x" }       # global.json: 8.0.0 + rollForward latestMajor

      # The nuget.config "godot-editor" source is a dev-machine-local Windows path that doesn't exist on a
      # clean runner; NuGet (and the Godot.NET.Sdk MSBuild resolver) hard-fail on a missing local source.
      - name: Drop the dev-machine Godot editor NuGet source
        run: dotnet nuget remove source godot-editor --configfile nuget.config
        shell: bash

      - uses: chickensoft-games/setup-godot@v2
        with: { version: "${{ env.GODOT_VERSION }}", use-dotnet: true, include-templates: true }

      - name: Import resources (first project open + .NET glue)
        run: godot --headless --path . --import || true
        shell: bash

      - name: Export windows-client
        # Godot's headless export often exits non-zero on benign warnings â€” `|| true`, then assert the
        # binary actually appeared so a REAL export failure (no output) still fails the job.
        run: |
          mkdir -p dist/windows-client
          godot --headless --path . --export-release "windows-client" dist/windows-client/XonoticGodot.exe || true
          test -f dist/windows-client/XonoticGodot.exe
        shell: bash

      # G10. `test -f` above proves a file appeared, which is NOT the same as proving the right engine
      # went into it: measured 2026-07-29, an empty custom_template/release makes Godot export a
      # complete, launchable binary from the STOCK template, so `|| true` plus a file check goes green on
      # a build missing every backport in tools/engine-patches/. This asserts on the binary's CONTENT,
      # which is the only thing that speaks to what shipped.
      - name: Verify the engine template that was used
        run: |
          python tools/verify-engine-template.py --patches \
            --binary dist/windows-client/XonoticGodot.exe --preset windows-client
        shell: bash

      # Maps are build output, fetched per data/maps.lock.json. Cached on the LOCKFILE hash so the cache
      # invalidates when the pinned map set changes rather than when the fetch script is edited.
      - name: Cache compiled maps
        uses: actions/cache@v6
        with:
          path: data/maps
          key: vortex-maps-${{ hashFiles('data/maps.lock.json') }}

      - name: Fetch compiled maps
        run: python tools/data/fetch-maps.py
        shell: bash

      - name: Package
        run: bash tools/package.sh --version "${{ needs.prep.outputs.version }}" windows-client
        shell: bash

      - uses: actions/upload-artifact@v7
        with: { name: zip-windows, path: "dist/XonoticGodot-*-windows-x86_64.zip", if-no-files-found: error }

  # â”€â”€ Linux desktop client + headless dedicated server â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  linux:
    needs: [prep]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false   # the map SOURCE tree (1.5 GB) is irrelevant to building a client
      - uses: actions/setup-dotnet@v5
        with: { dotnet-version: "9.0.x" }
      - name: Drop the dev-machine Godot editor NuGet source
        run: dotnet nuget remove source godot-editor --configfile nuget.config

      - uses: chickensoft-games/setup-godot@v2
        with: { version: "${{ env.GODOT_VERSION }}", use-dotnet: true, include-templates: true }

      - name: Import resources
        run: godot --headless --path . --import || true

      - name: Export linux-client + linux-dedicated
        # Godot's headless export often exits non-zero on benign warnings â€” `|| true`, then assert outputs.
        run: |
          mkdir -p dist/linux-client dist/linux-dedicated
          godot --headless --path . --export-release "linux-client"    dist/linux-client/XonoticGodot.x86_64 || true
          godot --headless --path . --export-release "linux-dedicated" dist/linux-dedicated/xonoticgodot-dedicated.x86_64 || true
          test -f dist/linux-client/XonoticGodot.x86_64
          test -f dist/linux-dedicated/xonoticgodot-dedicated.x86_64


      # Maps are build output, fetched per data/maps.lock.json. Cached on the LOCKFILE hash so the cache
      # invalidates when the pinned map set changes rather than when the fetch script is edited.
      - name: Cache compiled maps
        uses: actions/cache@v6
        with:
          path: data/maps
          key: vortex-maps-${{ hashFiles('data/maps.lock.json') }}

      - name: Fetch compiled maps
        run: python tools/data/fetch-maps.py
        shell: bash

      - name: Package
        run: bash tools/package.sh --version "${{ needs.prep.outputs.version }}" linux-client linux-dedicated

      - uses: actions/upload-artifact@v7
        with: { name: zip-linux, path: "dist/XonoticGodot-*-linux*.zip", if-no-files-found: error }

  # â”€â”€ macOS desktop client (BEST-EFFORT â€” never blocks the Win/Linux release) â”€â”€
  macos:
    needs: [prep]
    runs-on: macos-latest
    continue-on-error: true       # macOS export config (codesign/bundle id) is unverified â€” see ADR-0014
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false   # the map SOURCE tree (1.5 GB) is irrelevant to building a client
      - uses: actions/setup-dotnet@v5
        with: { dotnet-version: "9.0.x" }
      - name: Drop the dev-machine Godot editor NuGet source
        run: dotnet nuget remove source godot-editor --configfile nuget.config

      - uses: chickensoft-games/setup-godot@v2
        with: { version: "${{ env.GODOT_VERSION }}", use-dotnet: true, include-templates: true }

      - name: Import resources
        run: godot --headless --path . --import || true

      - name: Export macos-client
        # Godot's headless export often exits non-zero on benign warnings â€” `|| true`, then assert the .app.
        run: |
          mkdir -p dist/macos-client
          godot --headless --path . --export-release "macos-client" dist/macos-client/XonoticGodot.app || true
          test -d dist/macos-client/XonoticGodot.app


      # Maps are build output, fetched per data/maps.lock.json. Cached on the LOCKFILE hash so the cache
      # invalidates when the pinned map set changes rather than when the fetch script is edited.
      - name: Cache compiled maps
        uses: actions/cache@v6
        with:
          path: data/maps
          key: vortex-maps-${{ hashFiles('data/maps.lock.json') }}

      - name: Fetch compiled maps
        run: python tools/data/fetch-maps.py
        shell: bash

      - name: Package
        run: bash tools/package.sh --version "${{ needs.prep.outputs.version }}" macos-client

      - uses: actions/upload-artifact@v7
        with: { name: zip-macos, path: "dist/XonoticGodot-*-macos-*.zip", if-no-files-found: warn }

  # â”€â”€ Collect every zip, checksum, and publish the GitHub Release â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  release:
    needs: [prep, windows, linux, macos]
    runs-on: ubuntu-latest
    # softprops/action-gh-release creates the Release and uploads assets, which GitHub counts as a
    # `contents` write — there is no separate `releases` scope, so this is the narrowest grant that can
    # publish. Confined to this job precisely because it is coarse: the same token could also push
    # commits or move tags.
    permissions:
      contents: write
    steps:
      - name: Collect all zip artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: zip-*
          path: out
          merge-multiple: true

      - name: Flatten + checksum
        run: |
          mkdir -p final
          # Flatten whatever nesting upload-artifact produced into one dir, then checksum.
          find out -name 'XonoticGodot-*.zip' -exec mv {} final/ \;
          cd final
          sha256sum XonoticGodot-*.zip > "SHA256SUMS-${{ needs.prep.outputs.version }}.txt"
          echo "â”€â”€ release contents â”€â”€"; ls -lh

      # Tag pushes publish a real Release; workflow_dispatch runs stop here (artifacts only).
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: XonoticGodot ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            final/XonoticGodot-*.zip
            final/SHA256SUMS-*.txt
