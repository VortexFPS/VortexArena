# CI for the VortexArena port (T33 â€” see planning/decisions/ADR-0014-ci-packaging-distribution.md).
#
# Topology:
#   test       - always: restore + run the full xUnit suite (no Godot). Core content is COMMITTED, so
#                it runs against the real tree; only the map-dependent cases skip until maps are
#                fetched. `ci/ci.sh` stays the authoritative gate (it also runs the headless smokes).
#   build-host â€” always: compile the Godot host project (VortexArena.csproj) from a clean clone with
#                NO Godot editor installed â€” proves the Godot.NET.Sdk/GodotSharp 4.6.3 restore works
#                purely from nuget.org.
# Export + packaging + GitHub Releases live in a SEPARATE workflow (.github/workflows/release.yml),
# triggered on `v*` tags (and workflow_dispatch). Keeping the heavy Godot export off this per-push gate is
# deliberate (ADR-0014): the mono export templates are ~1 GB and the data is ~1.5 GB.
#
# nuget.config is nuget.org-only, so every job restores directly with no preparation. Godot.NET.Sdk 4.6.3 /
# GodotSharp 4.6.3 are published there (verified 2026-06) and the MSBuild SDK resolver for
# `Sdk="Godot.NET.Sdk/4.6.3"` reads the same config.
#
# Until 2026-08-01 that file also carried a "godot-editor" source pointing at the Windows dev machine's
# editor nupkgs folder, and because NuGet hard-fails on a MISSING LOCAL SOURCE, every job here had to run
# `dotnet nuget remove source godot-editor` before restoring. Those steps are gone with the source itself
# (bootstrap Phase 0) — the same missing-path failure broke every fresh clone, not just CI runners.

name: Tests

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  # Run the Node-20 JS actions on Node 24 now (documented opt-in; no-op once Node 24 is the default).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    name: Tests (libraries, no Godot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "9.0.x" # global.json: 8.0.0 + rollForward latestMajor (matches the dev machine)

      - name: Restore
        run: dotnet restore tests/VortexArena.Tests/VortexArena.Tests.csproj

      - name: Test
        run: >
          dotnet test tests/VortexArena.Tests/VortexArena.Tests.csproj
          -c Debug --no-restore
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: TestResults

  # WHY THIS JOB EXISTS. Four separate bugs were fixed on 2026-08-01 — hardcoded Windows Godot paths, a
  # committed local NuGet source, bare `python`, and `timeout` — and every one of them survived for the same
  # reason: the dev box is Windows, CI was Linux, and nothing ever ran on a Mac. They were not four
  # oversights, they were one blind spot with four symptoms. This job is the fix for the blind spot.
  #
  # It runs ci/ci.sh rather than dotnet directly, deliberately: the SHELL SCRIPTS are what rotted, so the
  # thing worth exercising is tools/lib/find-godot.sh, find-python.sh and run-timeout.sh under a real BSD
  # userland with bash 3.2 — not just whether the C# compiles. --no-smoke because there is no Godot here;
  # every other step runs.
  macos:
    name: macOS (arm64) — local gate scripts + suite
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "9.0.x"

      # Record what this runner actually is. Cheap, and it is the evidence for the portability claims the
      # scripts make — e.g. that `timeout` is genuinely absent here rather than assumed to be.
      - name: Toolchain facts
        run: |
          uname -sm
          sw_vers || true
          /bin/bash --version | head -1
          for t in python3 python timeout gtimeout perl curl; do
            printf '%-10s %s\n' "$t" "$(command -v $t || echo '(absent)')"
          done

      - name: Local gate (ci/ci.sh --no-smoke)
        run: bash ci/ci.sh --no-smoke

  build-host:
    name: Build Godot host (nuget.org SDK restore)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "9.0.x"

      - name: Build the Godot host project
        run: dotnet build VortexArena.csproj -c Debug
