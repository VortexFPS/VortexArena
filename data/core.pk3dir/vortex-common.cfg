// ============================================================================
//  vortex-common.cfg — the Vortex Arena config layer's ONLY entry point
// ============================================================================
//
// POLICY (restructure D8, §11): the xonotic-*.cfg files and every file they exec are
// UPSTREAM AND NEVER EDITED. All Vortex divergence lives in vortex-*.cfg and is applied
// additively on top. `set` is last-wins (DP semantics), so a later assignment here
// overrides the shipped value without touching the shipped file.
//
// WHY, and this is not hypothetical: the port's one config divergence was already lost
// once exactly this way. `physicsBryan.cfg` was a hand-edited copy of physicsX.cfg plus a
// hand-edit to xonotic-server.cfg to exec it. Re-pointing the content tree at a clean
// upstream checkout silently reverted both, and nothing failed — the game just ran stock
// physics while ConfigLoader.cs and planning/parity/cvar-diff-known.yaml both went on
// describing it as running ours. A layer upstream does not own cannot be reverted by an
// upstream refresh.
//
// This file is exec'd by the C# boot chain (MenuState.Boot, ConfigLoader.LoadServerConfig)
// AFTER the xonotic chain and BEFORE Cvar_LockDefaults, so these values become the shipped
// DEFAULTS — not values indistinguishable from ones the player typed. That ordering is G15
// and it is what keeps `set` here out of the player's config.cfg.
//
// Adding a layer file later is a content change with no code change: add it below.
// vortex-binds.cfg is deliberately NOT exec'd here — see its header.

exec vortex-physics.cfg
exec vortex-balance.cfg
exec vortex-bal-wep.cfg
exec vortex-server.cfg
exec vortex-client.cfg
