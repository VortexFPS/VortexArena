// vortex-physics.cfg — movement divergence from stock Xonotic.
//
// This file is the recovered `physicsBryan.cfg`. The whole divergence is three lines: it was
// never a fork of another preset, just physicsX.cfg (stock, `g_mod_physics Xonotic`) plus one
// port-added knob. xonotic-server.cfg:675 still execs physicsX.cfg exactly as upstream ships it.
//
// NOT physicsSamual.cfg, which is easy to conflate and is a materially different movement model
// (sv_maxspeed 420/235 vs 360/360, sv_accelerate 6 vs 15, air-strafe and air-control zeroed).
// Shipping that would change how the game plays. The names overlap innocently: physicsX.cfg
// itself carries a Samual-derived `sv_stepheight 31`, so Samual is cited *inside* stock.

// The step-up launch cap. A port extension — this cvar exists nowhere in upstream's data, and
// its default of -1 means disabled, so at stock defaults the code path is a strict no-op and
// byte-identical to Base (planning/parity/registry/physics-player.yaml:405).
set sv_step_upspeed_max 1

// The same knob for the client-selectable "bryan" set. PhysicsPreset.Resolve reads
// g_physics_<set>_* and falls back to the global cvar, so both are needed for the preset to
// carry its own value rather than inheriting.
set g_physics_bryan_step_upspeed_max 1

// Upstream (physics.cfg:10) ships this list without `warsow bryan`. A cvar assignment cannot
// append, so the full string is restated — meaning THIS LINE MUST BE RE-CHECKED whenever the
// upstream list changes, or a newly-added upstream preset silently disappears from the menu.
// That is the one real cost of the layer approach and it is worth paying here.
set g_physics_clientselect_options "xonotic nexuiz vecxis quake quake2 quake3 cpma bones xdf warsow bryan"
