last_audited: "2026-06-27"
# Re-audited 2026-06-27 (consolidated post-Wave-16/17 verify; W16 b3a9c06, W17 2f0bfdb) on branch
# claude/parity-port-waves. NET CHANGE vs the prior 2026-06-27 baseline:
#   ONE NEW half-wired hazard found on the map-vote rows (NOT a closed gap):
#   (*) mapvote.server_core / mapvote.client_ui: Wave 17 ADDED a NetControl.MapVote=22 opcode (NetProtocol.cs:240,
#       ProtocolVersion bumped 12→13) and a full per-peer server S2C send (ServerNet.SendMapVote, ServerNet.cs:1011,
#       called from the live ServerNet.cs:490 send loop) that serializes the entire ballot. BUT THE CLIENT DECODE
#       WAS NEVER WRITTEN: ClientNet.OnPacket's dispatch switch (ClientNet.cs:530-547) has NO `case NetControl.MapVote`
#       — the frame falls through to `default: break;` and is silently dropped. There is no ClientNet.HandleMapVote
#       (the ServerNet.cs:1010 comment "Field order mirrors ClientNet.HandleMapVote" references a method that does
#       not exist), and NetGame.UpdateMapVotePanel (NetGame.cs:3729) STILL reads only _serverWorld?.MapVote. So a
#       pure --connect client STILL cannot see or cast the ballot — the observable remote behaviour is UNCHANGED;
#       only the listen-server path remains live. The opcode now EXISTS but is dead on the receive side, so the
#       server burns bandwidth pushing a frame every remote client drops. The prior baseline's "there is still NO
#       NetControl.MapVote opcode" wording is now FACTUALLY STALE and has been corrected on both rows; the
#       partial-liveness CONCLUSION is unchanged. kind=new-gap (a half-wired send-only path; not a regression of
#       behaviour, but a latent producer-without-consumer hazard).
# Confirmed-still-true from the prior baseline (verified again this pass): matchend.nextlevel — NextLevel
#   (GameWorld.cs:3946) reproduces VoteReset/MatchEnd hooks/MarkWinners/DumpStats(true)/:gameover/PlayerStats/
#   Kill_Notification/Campaign.PreIntermission/Demo.OnMatchEnd/GameEndHookHandler; WeaponStats_Shutdown STILL the
#   lone omission (grep: zero refs in src/VortexArena.Server). nextmap.override all three exits live; overtime.cascade
#   STAT(OVERTIMES) networked via MatchState (ServerNet.cs:971/977/990 region); nextmap_broadcast rides MatchState
#   WriteString(nextMap) (ServerNet.cs:990). audio.cdtrack Intermission/PickIntermissionTrack untouched (the W16
#   MusicPlayer.cs edit was trigger_music last-wins ordering, a different unit).
# CHANGED-BUT-STILL-FAITHFUL: matchend.freeze — GameStopped now = Intermission.Running || MatchEnded ||
#   IsAssaultRoundFreeze (GameWorld.cs:2159); the prior `Timeout.IsPaused` term was REMOVED (timeout is deliberately
#   NOT game_stopped per the new comment) and Assault inter-round freeze folded in. The intermission freeze (the
#   Intermission.Running term) is unchanged → still faithful/live; code-read ref refreshed.
# No behavioural regressions on the live paths. UNCHANGED since the prior baseline (only line numbers shifted):
# timer.exittime, timer.input_early_exit, maplist.rotation, nextmap.changelevel, client.scoreboard_autoshow,
# client.view_freeze, client.autoscreenshot, audio.cdtrack. Intermission.cs itself is still byte-identical to the
# Wave-1/2 state.
summary:
  feature_count: 15
  worst_gaps:
    - "Map vote remains networked-incomplete for REMOTE clients and is now HALF-WIRED: Wave 17 added a NetControl.MapVote=22 opcode (NetProtocol.cs:240, ProtocolVersion 12→13) and a full server-side per-peer push (ServerNet.SendMapVote, ServerNet.cs:1011, on the live send loop) — but the CLIENT DECODE was never written. ClientNet.OnPacket's switch (ClientNet.cs:530-547) has no `case NetControl.MapVote`, so the frame is dropped at `default: break;`; there is no ClientNet.HandleMapVote (despite a ServerNet comment referencing it), and NetGame.UpdateMapVotePanel (NetGame.cs:3729) still reads only _serverWorld?.MapVote. Net result: the live ballot/cast path still works ONLY on a listen server; a pure --connect client still never sees the ballot and cannot vote — and the server now wastes bandwidth sending a frame every remote client discards."
    - "NextLevel still omits WeaponStats_Shutdown() (per-weapon accuracy-stats export) — but now DOES port DumpStats(true), the trailing localcmd(sv_hook_gameend) admin-script alias (GameEndHookHandler), VoteReset, MatchEnd_BeforeScores/MatchEnd hooks, Kill_Notification(NOTIF_ALL), and (client-side) target_music_kill."
    - "Map-vote client UI has no mouse/cursor click-to-vote (Base MapVote_InputEvent); voting is number-key 1..9 only on the listen server."
