summary:
  feature_count: 15
  worst_gaps:
    - "OPUS re-audit 2026-06-27 (branch claude/parity-port-waves): the prior baseline UNDER-claimed — reading the CURRENT code, FOUR gaps it still listed as open have actually been closed, plus the one it already credited. (1) touch_material_fx presentation missing→faithful: the four impact effects are registered in EffectsList.cs:303-306 (Effects.Register(\"IMPACT_METAL\",\"impact_metal\")+stone/wood/flesh), so EmitByEffectInfoName(\"impact_<mat>\") (SandboxMutator.cs:410) resolves a non-null Effect (Effect.ByEffectInfoName matches NetName, Effect.cs:87) and Emit (count 1..10 >0) is no longer dropped at ServerNet.WriteEffect; effectinfo.txt has the four blocks (5529+), unknown materials render nothing both ends. NOTE: networks-by-id is code-verified; the in-game particle was not visually re-confirmed (no kind:visual)."
    - "(2) object.spawn ModelExists: NO LONGER permissive on the live path — NetGame.WireSandbox:952-953 wires ModelExistsProvider = _vfs.Exists, so object_spawn rejects a non-existent model (Base fexists). (3) object.attach presentation missing→faithful: ObjectAttachSet now calls Api.Models.SetAttachment (SandboxMutator.cs:298-299) → EngineServices.SetAttachment (:796) sets Aiment+tag; MOVETYPE_FOLLOW child tracked each step by FlyMove.PhysicsFollow (:483) → real tag-follow (bone-precise offset is a renderer detail, not visually re-confirmed). (4) object_info mesh: tag enumeration no longer stubbed — MeshTagNamesProvider wired to ModelService.Tags (NetGame.cs:958-961), SandboxMutator.cs:890-893 prints the real tag list."
    - "CORRECTED: object.duplicate COPY clipboard is NOT an empty no-op (baseline was stale). SandboxObjectStore.SetClipboard → SetSandboxClipboard (NetGame.cs:948/971-983) sets cl_sandbox_clipboard (un-escaped, +MarkArchived) for the LOCAL-HOST player, so copy→paste works on a listen server. Residual: a remote client on a dedicated server is skipped (no svc_stufftext channel) → liveness stays partial. Command surface still GENUINELY LIVE: g_sandbox client-callable (Commands.cs:843), routed CmdSandbox (Commands.cs:2275, gated on sandbox.Added) → HandleCommand; WireSandbox (NetGame.cs:911, on the live setup path NetGame.cs:843) injects PrintTo/Trace/CryptoIdfp(=PersistentId)/NetName/ViewYaw/RealClients/Store/ModelExists/MeshTagNames; MutatorActivation.Apply at GameWorld.cs:631. All 15 g_sandbox* cfg defaults byte-identical (mutators.cfg:95-109)."
    - "The Sandbox_* veto hooks remain FULLY PORTED + fired at SandboxMutator.cs:358 (think grab) / :555 (DatabaseSave) / :632 (command gate) with no subscriber (Base-faithful empty MUTATOR_CALLHOOK). physics-2 → MoveType.Physics=32 (:823) == Base MOVETYPE_PHYSICS=32. Touch FX SOUND live (settouch equiv :204, dispatched by FlyMove.cs:107). STILL DEAD/MISSING (genuinely unchanged): drag/grab (+button8) entirely absent — no Drag/Drag_Begin/Drag_Finish; .Grab is computed (:359/361/363) but nothing consumes it; objects cannot be physically carried. CSQC object→client networking (CSQCMODEL_AUTOINIT/AUTOUPDATE) has no port seam (:236/376), so a spawned object's client render is unverified. (Several baseline line-number refs were stale by ~10-15 lines; refreshed where load-bearing.)"
