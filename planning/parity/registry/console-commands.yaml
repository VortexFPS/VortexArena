summary:
  feature_count: 25
  worst_gaps:
    - "The local HUD command group has graphical evidence for editor toggles, named exports, mounted QuickMenus, radar and temporary scoreboard columns. End-to-end automatic server interactions have separate assessments."
    - "A native remote client answered normal votes with F1/F2 and the nickname question independently. For local rankings, the player chooses nickname sharing in First Run, Profile or a manually opened match dialog."
    - "Record reports and installed-map listings now have dedicated and remote evidence. The native replies refresh on request and keep their empty-ladder message."
    - "Map list additions check the mounted BSP, and cleanup uses active-mode eligibility. The two dedicated hosts reproduced the same rotation."
    - "Generic/client verbs still missing include qc_curl, restartnotifs, the `red`/markup chat easter eggs, mv_download, print_cptimes, and the boxparticles/debugmodel/create_scrshot_ent debug commands."
