unit: mapinfo
category: server
base_ref_rev: "v0.8.6-1779-g863cd3e84"
last_audited: "2026-07-02"
summary:
  feature_count: 21
  worst_gaps:
    - "Hosted map rotation and votes check the installed BSP and its declared or generated modes. The weapon-feature gate is shared with the catalog. Some exclusion paths and standalone hosts without a wired catalog remain open."
    - "Native boot reads authored numeric match limits for the selected gametype. Legacy positional defaults, other mode hooks and the weighted unsupported-gametype fallback remain open."
    - "Native catalog, details and hosted rotation generate metadata and gametype eligibility from BSP entities or a mounted .ent replacement. The catalog reads Quake 3 .arena/.defi companions. Generated sidecar writes and random fallback CD tracks remain open."
    - "The catalog checks listing flags and the active weapon requirement. Explicitly loading a map without the required feature gives the stock warning."
    - "Native map settings cover shipped gameplay assignments, authored depth fog and three client visual defaults with optional typed server suggestions. The wider client cvar surface and unique-prefix map-name lookup remain open."
