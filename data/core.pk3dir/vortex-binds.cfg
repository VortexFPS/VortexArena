// vortex-binds.cfg — keybind divergence.
//
// Empty by design; see the sibling files' note on why an empty file beats an absent one.
//
// EXEC'D SEPARATELY, not from vortex-common.cfg, and it has to be exec'd at TWO call sites.
// binds-xonotic.cfg is itself exec'd twice on purpose: xonotic-client.cfg:603 pulls it in before
// any `bind` sink is registered, so those binds are parsed and DROPPED, and MenuState re-execs it
// after BindInput.RegisterBindCommands to actually fill BindTable. MenuState's settings scratch
// interpreter does the same thing again.
//
// So this file must follow binds-xonotic.cfg at BOTH sites. Wire it into only one and the Vortex
// binds land in one code path and not the other — which presents as a rebind that works until the
// player opens the settings dialog, or vice versa.
