; VortexArena export presets (T33 — ADR-0014; extended 2026-06 for the full release matrix).
; Four presets covering the ADR-0012 scope (Windows/Linux/macOS desktop clients + a headless server),
; mirroring the upstream binary topology (Base/Makefile: CLIENTBIN=xonotic-sdl + SERVERBIN=xonotic-dedicated):
;   preset.0  windows-client   — the Windows desktop client.
;   preset.1  linux-dedicated  — the headless server, exported in Godot's "dedicated server" mode
;                                (dedicated_server=true strips visual resources and applies the
;                                `dedicated_server` feature tag — the ADR-0012 server topology).
;                                NOTE: the mode is the BOOLEAN `dedicated_server` key, not an
;                                `export_filter` value (verified against the 4.6.3 editor's
;                                serialization: export_filter ∈ all_resources/scenes/resources/
;                                exclude/customized).
;   preset.2  linux-client     — the Linux desktop client (the playable Linux build).
;   preset.3  macos-client     — the macOS desktop client (.app bundle). BEST-EFFORT / UNVERIFIED:
;                                macOS export config is finicky (codesign + bundle id) and has never been
;                                run; the release workflow marks the macOS job continue-on-error so a macOS
;                                failure never blocks the Win/Linux release. `application/bundle_identifier`
;                                is REQUIRED or the export aborts. Architecture is "universal" (x86_64+arm64);
;                                if the .NET universal publish fails on CI, switch to "arm64" (matches the
;                                Apple-Silicon macos-latest runner) — see .github/workflows/release.yml.
; The game's content (data/) is NOT in the pck — they are mounted by the game's own
; VFS from BESIDE the binary (the install-dir contract). Resolution is now executable-relative, not CWD —
; DataPaths.Resolve probes <exe-dir>/data and, for the macOS .app, ../Resources/data —
; so a double-clicked binary works regardless of CWD. tools/package.sh lays the data out accordingly.
; CAUTION: the editor normalizes this file (and drops these comments) on first use.
;
; ── custom_template/release (ADR-0017, G10) ───────────────────────────────────────────────────────────
; ALL FOUR presets point at a template pinned in tools/engine-patches/engine.lock.json and fetched by
; `python tools/data/fetch-engine-template.py`. The filenames below are exactly what that script writes,
; so a fetch followed by an export needs no manual step. Until 2026-07-31 only windows-client was pinned
; and the other three were empty, which shipped Linux and macOS players an engine nobody had pinned.
;
; An EMPTY value here is the one genuinely dangerous state: Godot falls back to the stock template and
; exports a complete, launchable binary with none of the patches, WITHOUT failing. A wrong path aborts
; loudly (misleadingly, as an arch mismatch — see tools/engine-patches/README.md), so do not "fix" that
; by blanking the field. `tools/verify-engine-template.py --preset-config <preset>` gates exactly this.
;
; Only the WINDOWS template differs from stock in behaviour — the patch set touches platform/windows/
; exclusively. Linux and macOS are pinned for PROVENANCE: a build from known inputs whose hash we can
; check, rather than whatever stock template the exporting machine happened to have installed.
;
; linux-dedicated is pinned too, DELIBERATELY, even though a headless server has no mouse and the mouse
; backport is Windows-only so it would not carry it in any case. Two reasons the pin still earns its
; keep: it is the same file linux-client already fetches, so it costs nothing; and leaving exactly one
; preset empty re-creates the hole this change closes — a future patch that does touch Linux would miss
; the servers silently, and "which engine is this server running" would have no answer. Uniformity is
; also mechanically checkable, whereas "three of four, and you have to remember why" is not.

