// vortex-client.cfg — client, video and HUD divergence.
//
// (perf §12.7) The "smoothest play" video defaults. These MOVED HERE FROM C#
// (game/menu/framework/MenuState.cs, which used to _cvars.Set() them inline) because config is
// the better home: visible to the player, greppable, changeable without a rebuild, and counted
// by the same FilesExecuted/CvarsAssigned accounting as everything else.
//
// They override values the shipped xonotic-client.cfg sets, which is the entire point of the
// layer. Ordering still holds: vortex-common.cfg is exec'd after the xonotic chain and before
// Cvar_LockDefaults, so these become the locked DEFAULT — persisted only if the player moves
// them, and a player's own config.cfg value still wins.
//
// BEHAVIOUR NOTE: unlike the old C# assignment, these no longer apply when no content tree is
// mounted (a bare CI run), because the file is not there to exec. That is the correct reading —
// with no content mounted the game falls back to registered defaults across the board — but it
// IS a change from unconditional.

// EXCLUSIVE fullscreen: takes the desktop compositor out of the present path. Desktop-fullscreen
// (1) still composites on Windows, which is the missed-vblank double-frames in the hitch logs.
set vid_fullscreen 2

// vsync OFF (2026-07-06, after the uncapped decomposition): measured -0.5 ms/frame AND better
// lows than the previous mailbox default — perf-campaign doc Phase 1c. DP-style raw present,
// tearing accepted. 1/2/3 remain selectable from the console or the video menu.
set vid_vsync 0

// Texture compression ON (2026-08-02, Bryan's call — a deliberate deviation from upstream's 0).
// Measured with the VRAM census: resident textures 2378 MB (all rgba8) -> 805 MB, total VRAM
// ~3.4 GB -> ~1.6 GB, compress cost <1 s across a whole map load (tex.compress scope). The eleven
// per-category gates keep their DP defaults (color/gloss/glow/reflect on; normal/2d/lightmaps off).
// NOTE: on the current export template the S3TC encoder is absent (Godot ships etcpak's ENCODERS
// editor-only; engine patch pending in tools/engine-patches/) so release builds transparently
// encode BC7 instead — higher quality, 8 bpp vs 4, i.e. roughly half the color-class saving until
// the patched template lands. The census line "compression: ..." in every session summary says
// which path ran. planning/perf-deep-dive-2026-08-02.md §5c is the full ledger.
set gl_texturecompression 1

// Normal maps too (2026-08-02, second deliberate deviation — upstream/DP keep _normal 0 because their
// runtime codec is the S3TC COLOR family, which visibly bands normals). Ours takes the industry path:
// CompressSource.Normal -> two-channel BC5/RGTC, with the shaders reconstructing Z behind the norm_rg
// per-material flag (LightmapShader/PlayerSkinShader). The Normal class was the largest remaining
// uncompressed block in the VRAM census (450-458 MB -> ~115 at BC5). On a build without the S3TC
// encoder this falls through to BC7-Generic with everything else (still correct, still compressed).
set gl_texturecompression_normal 1


// ---- Create Game: default player slots -------------------------------------------------------
// The menu's half of the 32-slot default (the server half is `maxplayers 32` in vortex-server.cfg;
// they are meant to move together). Without this the Create Game screen would keep upstream's 16 and
// quietly hand it to the host on every menu-started match — menu_loadmap_prepare feeds this slider
// into `maxplayers`, so the menu path would undo the server default rather than inherit it.
//
// Plain `set`, not `seta`: xonotic-client.cfg:620 already ships this as `seta`, so the cvar is
// archiveable ALREADY and a `seta` here would only widen config.cfg beyond upstream's set for no
// reason. A player who moves the slider still gets their choice persisted, and it still wins over
// this default.
set menu_maxplayers 32


// ---- console conveniences -------------------------------------------------------------------
// Findable names for `lsmaps`. "ls"-prefixed verbs read as shell muscle memory to some players and
// as nothing at all to others, and a player looking for the map list types what they mean. Both
// forward their arguments, so `maps ctf` filters exactly as `lsmaps ctf` does.
//
// Aliases rather than C# registrations on purpose: an alias is config-shaped, and this layer is the
// documented home for that (same reasoning as the video defaults above). They resolve to the
// REGISTERED `lsmaps` command — registered names outrank aliases in the interpreter — so they get
// the client-side behaviour that answers even with no server running, not the upstream
// `qc_cmd_svcmd` alias chain.
alias listmaps "lsmaps ${* ?}"
alias maps     "lsmaps ${* ?}"
