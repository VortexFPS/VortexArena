  feature_count: 21
  worst_gaps:
    - "Race, CTS and gated CTF capture rankings are live. Rankings reload from the native profile. Exact rankings page animation remains incomplete."
    - "The native team scoreboard transports the primary team score only. Secondary scores cannot break ties."
    - "FPS and skill cells, movement-loss suffix, several name icons, and aligned spectator columns remain incomplete."
  notable_fixes_since_last_audit:
    - "Re-audited all 21 rows in registry order against 863cd3e8456e18f577f7fe5fef857ff55ae62cc0."
    - "Corrected pickup filtering and item order, stat-block gates and fades, accuracy palette lookup, race paging and resend, and authoritative map stats on the remote client."
    - "Verified the native dedicated join/gameplay path and HUD skin export. See planning/parity/scoreboard-blocks/README.md for the indexed captures and test scope."
    - "Restored nested and bare scoreboard commands, transient column layouts, remote map weapon availability, and gated CTF capture rankings."
