      - { kind: code-read, ref: "MUTATOR_ONADD cvar_settemp IS modelled. Hook() (RandomGravityMutator.cs:50-51) calls MutatorActivation.SettempCvar(\"sv_gravity\", Api.Cvars.GetString(\"sv_gravity\")); the host wires SettempCvarHandler = SettempCvars.Set at GameWorld.cs:630 (BEFORE Apply() at :631), so the original gravity is pushed onto the server's settemp restore stack and reverted at match end. Headless (unwired) falls back to a plain cvar set (MutatorActivation.cs:40-43) — no restore target exists there anyway, matching QC's no-op.", result: pass }
