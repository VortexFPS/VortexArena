// vortex-server.cfg — server-side rules, gametype and mutator divergence.
//
// The file exists rather than being absent so that ConfigInterpreter.FilesMissing stays at ZERO on
// a normal boot — a counter that is permanently non-zero is useless as a signal, and that counter
// is how a genuinely missing config gets noticed (ConfigTests pins the missing-file-is-a-no-op
// behaviour).
//
// Add divergence with plain `set`, not `seta`. Per ConfigLoader's archive-hook contract the
// SHIPPED cfgs are the authority on which cvars are archiveable; `seta` here would widen the
// player's config.cfg beyond upstream's set. Use it only to introduce a deliberately new
// archiveable cvar.

// The default server name. Overrides xonotic-server.cfg:12's "Xonotic $g_xonoticversion Server":
// this game advertises itself as Vortex (VortexArena.Net.GameIdentity), so a host that has not been
// given a name should say so rather than claiming to be an Xonotic server. That upstream default also
// came out as "Xonotic  Server", with a double space, because g_xonoticversion is set only in
// xonotic-common.cfg — which this port's boot chain does not exec — so the interpolation had nothing
// to expand. `menu_use_default_hostname` still governs whether the menu replaces this with the
// player's own.
//
// No version in the name on purpose: the build travels in qcstatus, where the browser reads it, and
// an operator's server name is more useful as a name. `$g_vortexversion` is registered before this
// file runs (VortexArena.Server.Cvars.RegisterDefaults) if you do want it here.
hostname "Vortex Server"
